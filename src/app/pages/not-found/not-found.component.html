<section class="not-found-page">
  <div class="container text-center">
    <div class="svg-wrapper mb-4">
      <img
        src="assets/images/404-car-road.svg"
        alt="Car on a wrong road"
        class="not-found-svg mb-4"
      />
    </div>
    <h1 class="error-code">404</h1>
    <h3 class="mb-3">Slow down there 😅 — looks like this road has no tarmac.</h3>
    <p class="text-muted mb-4">
      Page not found. Looks like you took a wrong turn — this road leads nowhere.
    </p>
    <app-button
      text="Back to Safety"
      icon="bi bi-arrow-left"
      variant="primary"
      (click)="goHome()">
    </app-button>
  </div>
</section>
